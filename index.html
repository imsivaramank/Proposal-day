<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavinci ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* Question screen */
#question {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 3rem;
  margin-bottom: 30px;
}

/* Buttons */
button {
  font-size: 22px;
  padding: 15px 30px;
  margin: 10px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

#yesBtn {
  background: #ff2e63;
  color: white;
}

#noBtn {
  background: gray;
  color: white;
  position: absolute;
}

/* Result section */
#result {
  display: none;
  padding: 20px;
}

.gallery img {
  width: 280px;
  margin: 15px;
  border-radius: 15px;
  box-shadow: 0 0 15px pink;
}

/* Fireworks canvas */
#fireworks {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
}

.content {
  position: relative;
  z-index: 2;
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<!-- Question -->
<div id="question">
  <h1>Kavinci, Will you be my Valentine? ❤️</h1>
  <button id="yesBtn" onclick="yesClicked()">YES 💖</button>
  <button id="noBtn">NO 😜</button>
</div>

<!-- Result -->
<div id="result" class="content">
  <h1>You just made me the happiest man alive ❤️</h1>

  <div class="gallery">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
    <img src="img4.jpg">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
  </div>

  <h2>Forever yours, Siva ❤️</h2>
</div>

<script>

/* RUN AWAY NO BUTTON */
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});


/* FIREWORKS CODE */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height / 2;

  for (let i = 0; i < 80; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6,
      alpha: 1,
      color: `hsl(${Math.random() * 360},100%,60%)`
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.01;

    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();

    if (p.alpha <= 0) particles.splice(i, 1);
  });

  requestAnimationFrame(animate);
}

function startFireworks() {
  setInterval(createFirework, 500);
  animate();
}


/* YES CLICK FUNCTION */
function yesClicked() {
  document.getElementById("question").style.display = "none";
  document.getElementById("result").style.display = "block";
  startFireworks();
}

</script>

</body>
</html>
