<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kavinci ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card {
  background: white;
  padding: 40px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  z-index: 2;
}

h1 {
  color: #ff3366;
  margin-bottom: 30px;
}

button {
  font-size: 20px;
  padding: 14px 36px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  transition: transform 0.2s;
}

#yes {
  background: #ff3366;
  color: white;
  box-shadow: 0 0 25px #ff3366;
}

#yes:hover {
  transform: scale(1.1);
}

#no {
  background: #eee;
  color: #333;
  position: absolute;
}

#celebration {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  z-index: 10;
  overflow: hidden;
}

/* Slideshow */
.slideshow {
  position: absolute;
  inset: 0;
}

.slideshow img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: slide 28s infinite;
}

.slideshow img:nth-child(1) { animation-delay: 0s; }
.slideshow img:nth-child(2) { animation-delay: 4s; }
.slideshow img:nth-child(3) { animation-delay: 8s; }
.slideshow img:nth-child(4) { animation-delay: 12s; }
.slideshow img:nth-child(5) { animation-delay: 16s; }
.slideshow img:nth-child(6) { animation-delay: 20s; }
.slideshow img:nth-child(7) { animation-delay: 24s; }

@keyframes slide {
  0% { opacity: 0; }
  10% { opacity: 1; }
  30% { opacity: 1; }
  40% { opacity: 0; }
  100% { opacity: 0; }
}

/* Text */
.message {
  position: absolute;
  bottom: 12%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 40px;
  font-weight: 600;
  text-shadow: 0 0 20px pink;
  z-index: 5;
}

/* Hearts */
.heart {
  position: absolute;
  color: pink;
  font-size: 24px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>💖 Kavinci, will you be my Valentine? 💖</h1>
  <button id="yes">YES 💕</button>
  <button id="no">NO 🙈</button>
</div>

<div id="celebration">
  <div class="slideshow">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
    <img src="img4.jpg">
    <img src="img5.jpg">
    <img src="img6.jpg">
    <img src="img7.jpg">
  </div>

  <div class="message">
    You just made me the happiest man alive ❤️<br>
    Forever yours, Siva
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const card = document.getElementById("card");
const celebration = document.getElementById("celebration");

// NO button escape 😈
noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 120);
  const y = Math.random() * (window.innerHeight - 60);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// YES click ❤️
yesBtn.addEventListener("click", () => {
  card.style.display = "none";
  celebration.style.display = "block";
  startHearts();
});

// Floating hearts
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);
}
</script>

</body>
</html>
